name: Captura casi en vivo

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar FIRMS NRT
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/fetch_live.py
      - name: Regenerar captura
        run: python pipeline/live_snapshot.py
      - name: Verificar contra los datos crudos (si falla, no se publica)
        run: python tests/test_live.py
      - name: Publicar si cambió
        run: |
          if git diff --quiet -- web/data/live_snapshot.json; then
            echo "Sin cambios en la captura."
            exit 0
          fi
          git config user.name "fire-record-bot"
          git config user.email "fire-record-bot@users.noreply.github.com"
          git add web/data/live_snapshot.json web/data/tle.json data/live/raw
          git commit -m "Captura automática FIRMS NRT $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
